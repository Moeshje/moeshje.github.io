<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Systems</title>
    <style>
        :root {
            --accent-color: #f1e7a9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--accent-color);
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .header-nav {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .img-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: inline-block;
        }

        .img-btn img {
            display: block;
            max-height: 40px;
            width: auto;
        }
    </style>
</head>
<body>

    <header class="header-nav">
        <a href="#" class="img-btn">
            <img src="" alt="Button Image">
        </a>
    </header>

</body>
</html>
