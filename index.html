<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="star-favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Systems</title>
    <style>
        :root {
            --accent-color: #f1e7a9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: url('XaidrBZfEwU.jpg') no-repeat center center fixed; /* https://freerangestock.com/photo/102576/starry-night-sky-above-desert */
            background-size: cover;
            background-color: #000;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--accent-color);
            display: flex;
            flex-direction: column;
        }
        
        .top-bar {
          background-color: rgba(0, 0, 0, 0.75);
          display: flex;
          align-items: center;
          justify-content: flex-start;
          gap: 20px;
          padding: 10px 15px;
          min-height: 40px;
        }
        
        .top-bar {
          border-top: 1px solid var(--accent-color);
          border-bottom: 1px solid var(--accent-color);
          box-shadow: 0 0 8px var(--accent-color);
        }
    
        .top-bar a.logo-btn img {
          display: block;
          max-height: 40px;
          width: auto;
        }
        
        .top-bar a.nav-link {
          color: var(--accent-color);
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
          padding: 5px 10px;
        }
        
        .top-bar a.nav-link:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="https://starsystems.tech" class="logo-btn">
            <img src="starnobg.png" alt="Star Systems Logo">
        </a>
        <a href="mcus/" class="nav-link">MCU's</a>
    </header>

</body>
</html>
