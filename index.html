<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="star-favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Systems</title>
    <style>
        :root {
            --accent-color: #f1e7a9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: url('XaidrBZfEwU.jpg') no-repeat center center fixed; /* https://freerangestock.com/photo/102576/starry-night-sky-above-desert */
            background-size: cover;
            background-color: #000;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--accent-color);
            display: flex;
            flex-direction: column;
        }
        
        .top-bar {
          background-color: rgba(0, 0, 0, 0.75);
          display: flex;
          align-items: center;
          justify-content: flex-start;
          gap: 20px;
          padding: 10px 15px;
          min-height: 40px;
          position: relative;
        }

        .top-bar::after {
          content: '';
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 2px;
          background: linear-gradient(
            to right,
            transparent,
            var(--accent-color) 20%,
            var(--accent-color) 80%,
            transparent
          );
          opacity: 0.8;
        }
            
        .top-bar a.logo-btn img {
          display: block;
          max-height: 40px;
          width: auto;
        }
        
        .top-bar a.nav-link {
          color: var(--accent-color);
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
          padding: 5px 10px;
        }
        
        .top-bar a.nav-link:hover {
          text-decoration: underline;
        }
        .separator-fade {
          width: 1px;
          height: 28px;
          background: linear-gradient(
            to bottom,
            transparent,
            var(--accent-color),
            transparent
          );
          opacity: 0.5;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="https://starsystems.tech" class="logo-btn">
            <img src="starnobg.png" alt="Star Systems Logo">
        </a>
        <div class="separator-fade"></div>
        <a href="mcus/" class="nav-link">MCU's</a>
    </header>

</body>
</html>
